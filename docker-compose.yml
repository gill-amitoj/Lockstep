# Local infrastructure. Values come from the .env file next to this one
# (copy .env.example to .env). Nothing secret is committed.
name: lockstep

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lockstep_ledger
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
