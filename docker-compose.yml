# Local infrastructure. Values come from the .env file next to this one
# (copy .env.example to .env). Nothing secret is committed.
name: lockstep

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lockstep_ledger
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the fraud service's database. Init scripts only run when the data
      # volume is first created; after changing them: docker compose down -v
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single broker in KRaft mode (no ZooKeeper). The image's defaults listen on,
    # and advertise, localhost:9092, which is what apps running on the host need.
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  postgres-data:
