spring.application.name=fraud-service
# 8081 so both services can run side by side on one machine (the ledger uses 8080).
server.port=${PORT:8081}

# Its own database (database-per-service), on the same Postgres server locally.
spring.datasource.url=${FRAUD_DB_URL:jdbc:postgresql://localhost:5432/lockstep_fraud}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Verifies the ledger's tokens: same secret, ledger's issuer.
fraud.jwt.secret=${JWT_SECRET:}
fraud.jwt.issuer=lockstep-ledger

# --- Kafka consumer ---------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# All fraud-service instances share one group, so each event goes to exactly one of them.
spring.kafka.consumer.group-id=fraud-service
# A brand-new group starts from the oldest retained event, so nothing published
# before the first deployment is skipped.
spring.kafka.consumer.auto-offset-reset=earliest
# One listener thread per partition of the 3-partition topic.
spring.kafka.listener.concurrency=3
fraud.kafka.transfer-topic=ledger.transfer-completed
fraud.kafka.dead-letter-suffix=.DLT

# --- Rules ------------------------------------------------------------------------
fraud.rules.large-amount.multiplier=5
fraud.rules.large-amount.min-history=1
fraud.rules.velocity.max-transfers=5
fraud.rules.velocity.window=PT10M

logging.structured.format.console=${LOG_FORMAT:ecs}
