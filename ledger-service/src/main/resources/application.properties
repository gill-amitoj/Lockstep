spring.application.name=ledger-service

# Connection settings come from environment variables (see .env.example).
# The URL has a local default; the username and password have none on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lockstep_ledger}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside the service layer, not lazily during JSON rendering.
spring.jpa.open-in-view=false

# Money safety: by default Jackson turns {"amountCents": 10.99} into 10 and the
# request succeeds with the wrong amount. Reject fractional numbers instead (400).
spring.jackson.deserialization.accept-float-as-int=false

# --- Security -----------------------------------------------------------------
# No default secret: the app refuses to start unless JWT_SECRET (>= 32 bytes) is set.
lockstep.jwt.secret=${JWT_SECRET:}
lockstep.jwt.issuer=lockstep-ledger
lockstep.jwt.ttl=PT1H
# Optional: creates the first ADMIN user at startup if both are set.
lockstep.admin.username=${ADMIN_USERNAME:}
lockstep.admin.password=${ADMIN_PASSWORD:}

# --- Reconciliation -------------------------------------------------------------
lockstep.reconciliation.scheduled=true
lockstep.reconciliation.initial-delay=PT1M
lockstep.reconciliation.interval=${RECONCILIATION_INTERVAL:PT1H}

# --- Logging --------------------------------------------------------------------
# One JSON object per log line (Elastic Common Schema). MDC values such as
# correlationId, and key-value pairs added with log.atInfo().addKeyValue(...),
# become JSON fields, so logs can be searched by field instead of with regexes.
# Set LOG_FORMAT= (empty) for plain-text logs while developing.
logging.structured.format.console=${LOG_FORMAT:ecs}
