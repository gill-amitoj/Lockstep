spring.application.name=ledger-service

# Connection settings come from environment variables (see .env.example).
# The URL has a local default; the username and password have none on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/settle_ledger}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside the service layer, not lazily during JSON rendering.
spring.jpa.open-in-view=false

# Money safety: by default Jackson turns {"amountCents": 10.99} into 10 and the
# request succeeds with the wrong amount. Reject fractional numbers instead (400).
spring.jackson.deserialization.accept-float-as-int=false

# Spring MVC's own errors (malformed JSON, wrong method, ...) as RFC 9457 problem+json.
spring.mvc.problemdetails.enabled=true
